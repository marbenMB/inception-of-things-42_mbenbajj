apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  ingressClassName: traefik

  rules:
    - host: web.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - http:                      # no host: every other request → the default app
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web        # put the Service you want as the default here
                port:
                  number: 80