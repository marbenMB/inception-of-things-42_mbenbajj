      const sel = h("select", { id: "doneUpTo", "aria-label": "Last section you finished" },
        h("option", { value: "-1" }, "New: start from the beginning"),
        mains.map(m => h("option", { value: m.num }, "Finished up to section " + m.num + ": " + m.title)));
      app.append(h("section", { class: "panel resume" },
        h("div", { class: "eyebrow" }, "Cluster Quest"),
        h("h1", {}, "Where are you in the lab?"),
        h("p", {}, "The Kubernetes lab, one small step at a time. Go slowly. The goal is to understand each step, not to finish."),
        h("p", {}, "Each step earns XP, and a step every day builds your streak. Already did part of the lab? Pick the last section you finished and those missions are marked done."),
        h("div", { class: "cta" }, sel,
          h("button", { class: "btn primary", onclick: () => {
            const upTo = +$("#doneUpTo").value;
            mains.forEach(m => { if (m.num <= upTo && !missionDone(m.num)) { S.completed.push(m.num); S.xp += XP.mission; } });
            S.onboarded = true; save(); renderBar(); renderHome();
          } }, "Start"))));
      return;
    }

    if (target && away >= 12 && doneCount + Object.keys(S.steps).length > 0) {
      const days = Math.floor(away / 24);
      const m = byNum(target.m);
      const s = m.steps[target.s] || m.steps[0];
      app.append(h("section", { class: "panel resume" },
        h("div", { class: "eyebrow" }, (days >= 1 ? plural(days, "day") : plural(Math.floor(away), "hour")) + " since your last visit"),
        h("h1", {}, m.title),
        h("p", {}, "You were on " + nameOf(m) + ", step " + (target.s + 1) + ": " + s.title + ". Check that the VMs and the cluster survived the break first. It takes a minute."),
        h("div", { class: "cta" },
          h("button", { class: "btn big", onclick: openReentry }, "Re-entry check"),
          h("button", { class: "btn primary big", onclick: () => openMission(target.m, target.s) }, "Continue →"))));
    } else if (target) {
      const m = byNum(target.m);
      const total = m.steps.length;
      const done = m.steps.filter((_, i) => isDone(m.num, i)).length;
      app.append(h("section", { class: "panel resume" },
        h("div", { class: "eyebrow" }, nameOf(m)),
        h("h1", {}, m.title),
        h("p", {}, (done ? (total - done) + " of " + total + " steps left" : plural(total, "step")) + " · about " + MIN[m.num] + " min"),
        h("div", { class: "cta" },
          h("button", { class: "btn primary big", onclick: () => openMission(target.m, target.s) }, done ? "Continue →" : "Start mission →"))));
    } else {
      app.append(h("section", { class: "panel resume" },
        h("h1", {}, "Quest complete"),
        h("p", {}, "Every mission is done. Run section 15 again whenever you want to rebuild the cluster from zero and practise."),
        h("div", { class: "cta" }, h("button", { class: "btn", onclick: openCheat }, "Open the cheat sheet"))));
    }

    const rq = reviewQueue();
    if (rq.length) {
      app.append(h("section", { class: "panel review" },
        h("div", { class: "grow" },
          h("b", {}, "Review · " + plural(rq.length, "card")),
          h("div", { class: "small" }, "About " + Math.max(1, Math.round(rq.length / 3)) + " min")),
        h("button", { class: "btn", onclick: openReview }, "Review")));
    }

    app.append(h("div", { class: "route-head" },
      h("h2", {}, "Missions"),
      h("span", {}, doneCount + " of " + missions.length + " done")));
    const list = h("ol", { class: "stops" });
    const nextNum = nextMissionNum();
    missions.forEach((m, i) => {
      const done = missionDone(m.num);
      const prevMain = missions.slice(0, i).reverse().find(p => !p.side);
      const locked = !m.side && !done && prevMain && !missionDone(prevMain.num) && m.num !== nextNum;
      const total = m.steps.length;
      const stepsDone = m.steps.filter((_, j) => isDone(m.num, j)).length;
      const cls = "stop" + (done ? " done" : "") + (m.num === nextNum ? " next" : "") + (locked ? " locked" : "");
      const progress = !done && stepsDone ? stepsDone + " of " + total + " steps" : plural(total, "step");
      list.append(h("li", {}, h("button", { class: cls, onclick: () => {
          if (locked && !confirm("Skip ahead to Mission " + m.num + "? Every mission before it will be marked done.")) return;
          if (locked) { missions.slice(0, i).forEach(p => { if (!p.side && !missionDone(p.num)) { S.completed.push(p.num); S.xp += XP.mission; } }); save(); renderBar(); }
          const resumeHere = S.current && S.current.m === m.num ? S.current.s : 0;
          openMission(m.num, done ? 0 : resumeHere);
        } },
        h("span", { class: "mark" }, done ? icon("check") : locked ? icon("lock") : h("span", { class: "ring" })),
        h("span", { class: "n" }, m.side ? "" : String(m.num)),
        h("span", { class: "t" }, m.title),
        h("span", { class: "m" }, (m.side ? "side quest · " : "") + MIN[m.num] + " min · " + progress))));
    });
    app.append(list);
    app.append(h("button", { class: "reset", onclick: () => {
      if (confirm("Reset all progress, XP and streak?")) { S = fresh(); save(); renderBar(); renderHome(); }
    } }, "Reset progress"));
  }

  function openMission(n, s = 0) {
    const m = byNum(n);
    if (!m) return;
    view = "mission"; atMission = n; atStep = Math.max(0, Math.min(s, m.steps.length - 1));
    S.current = { m: n, s: atStep }; save();
    renderMission();
    window.scrollTo({ top: 0 });
  }

  function renderMission() {
    const m = byNum(atMission);
    const step = m.steps[atStep];
    const total = m.steps.length;
    const left = total - atStep - 1;
    document.title = "(" + (atStep + 1) + "/" + total + ") " + m.title;
    app.innerHTML = "";

    app.append(h("div", { class: "mhead" },
      h("div", { class: "eyebrow" }, nameOf(m) + " · about " + MIN[m.num] + " min"),
      h("h2", {}, m.title)));
    app.append(segments(total,
      i => (OPTIONAL.includes(m.steps[i].kind) ? " opt" : "") + (isDone(m.num, i) ? " done" : "") + (i === atStep ? " cur" : ""),
      i => { atStep = i; S.current = { m: m.num, s: i }; save(); renderMission(); },
      i => (i + 1) + ". " + m.steps[i].title));
    app.append(h("div", { class: "togo" },
      left === 0 ? "Last step" : "Step " + (atStep + 1) + " of " + total + (left <= 2 ? " · " + plural(left, "step") + " left" : "")));

    const tagText = {
      main: "Step", bonus: "Bonus · optional", quiz: "Quiz", warmup: "Warm-up · optional",
      checkpoint: "Checkpoint", comeback: "Before you start · optional",
    }[step.kind];
    const card = h("article", { class: "card" },
      h("div", { class: "tag" }, tagText),
      h("h3", { class: "steptitle" }, step.title));
    if (step.kind === "comeback") card.append(h("p", { class: "hint" }, "Here a minute ago? Skip it"));
    if (/^Predict/.test(step.title)) card.append(h("p", { class: "hint" }, "Guess before you run anything. A wrong guess shows you what you hadn't understood yet."));
    card.append(contentOf(step.nodes));

    const isLast = atStep === total - 1;
    const doneLabel = isLast ? "Complete mission" : step.kind === "quiz" ? "I answered them →" : "Done, next →";
    card.append(h("div", { class: "nav" },
      h("button", { class: "btn ghost", onclick: back, disabled: atStep === 0 ? "" : false }, "← Back"),
      h("span", { class: "grow" }),
      OPTIONAL.includes(step.kind) && !isLast ? h("button", { class: "btn", onclick: () => go(false) }, "Skip") : null,
      h("button", { class: "btn primary", id: "nextBtn", onclick: () => go(true) }, doneLabel)));
    app.append(card);
  }

  function go(markDone) {
    const m = byNum(atMission);
    const step = m.steps[atStep];
    const key = stepKey(m.num, atStep);
    if (markDone && !S.steps[key] && !missionDone(m.num)) { S.steps[key] = 1; addXp(XP[step.kind] || 10); }
    if (atStep < m.steps.length - 1) {
      atStep++; S.current = { m: m.num, s: atStep }; save(); renderMission(); window.scrollTo({ top: 0 });
    } else {
      completeMission(m);
    }
  }
  function back() { if (atStep > 0) { atStep--; S.current = { m: atMission, s: atStep }; save(); renderMission(); } }

  function completeMission(m) {
    const first = !missionDone(m.num);
    if (first) { S.completed.push(m.num); addXp(XP.mission); }
    S.current = null; save();
    const next = byNum(nextMissionNum());
    const newCards = cards.filter(c => c.m === m.num).length;
    confetti();
    showOverlay(h("div", { class: "modal" },
      h("h2", {}, nameOf(m) + " complete"),
      first ? h("div", { class: "figure" }, "+" + XP.mission + " XP") : null,
      first && newCards ? h("p", {}, plural(newCards, "new review card")) : null,
      next ? h("p", {}, "Next: " + next.title + (next.side ? " (side quest)" : "") + " · " + MIN[next.num] + " min") : h("p", {}, "That was the last mission"),
      h("div", { class: "cta" },
        h("button", { class: "btn", onclick: () => { closeOverlay(); renderHome(); toast("Progress saved"); } }, "Stop here"),
        next ? h("button", { class: "btn primary", id: "keepGoing", onclick: () => { closeOverlay(); openMission(next.num, 0); } }, "Keep going →") : null)));
  }

  function showOverlay(modal) {
    closeOverlay();
    overlayOpen = true;
    const ov = h("div", { class: "overlay", id: "overlay", role: "dialog", "aria-modal": "true", onclick: e => { if (e.target.id === "overlay") closeOverlay(); } }, modal);
    document.body.append(ov);
    const primary = ov.querySelector(".btn.primary");
    if (primary) primary.focus();
  }
  function closeOverlay() { const o = $("#overlay"); if (o) o.remove(); overlayOpen = false; }

  function openReentry() {
    const m0 = byNum(0);
    const st = m0 && m0.steps.find(s => /^Coming back after a break/.test(s.title));
    const target = resumeTarget();
    showOverlay(h("div", { class: "modal left" },
      h("h2", {}, "Re-entry check"),
      st ? contentOf(st.nodes) : h("p", {}, "Run vagrant status, then kubectl get nodes."),
      h("div", { class: "cta" },
        h("button", { class: "btn", onclick: closeOverlay }, "Close"),
        target ? h("button", { class: "btn primary", onclick: () => { closeOverlay(); openMission(target.m, target.s); } }, "All good, continue →") : null)));
  }

  // ---------- Cheat sheet drawer ----------
  const drawer = $("#drawer");
  function openCheat() {
    drawer.innerHTML = "";
    drawer.append(h("div", { class: "drawer-head" },
        h("h2", {}, "Cheat sheet"),
        h("button", { class: "btn small ghost close", onclick: closeCheat }, icon("x"), "Close")),
      contentOf(cheatNodes));
    drawer.classList.add("open");
  }
  function closeCheat() { drawer.classList.remove("open"); }

  // ---------- Confetti, on mission complete only, in the machine colors ----------
  function confetti() {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const c = h("canvas", { id: "confetti" });
    const ctx = c.getContext && c.getContext("2d");
    if (!ctx) return;
    document.body.append(c);
    c.width = innerWidth; c.height = innerHeight;
    const css = getComputedStyle(document.documentElement);
    const colors = ["--accent", "--server", "--worker", "--pod"].map(v => css.getPropertyValue(v).trim());
    const parts = Array.from({ length: 90 }, () => ({
      x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 12, vy: Math.random() * -11 - 3,
      s: Math.random() * 5 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[Math.floor(Math.random() * colors.length)],
    }));
    const start = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, c.width, c.height);
      for (const p of parts) {
        p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
      }
      if (t - start < 1600) requestAnimationFrame(frame); else c.remove();
    })(start);
  }

  // ---------- Wiring ----------
  $("#cheatBtn").prepend(icon("terminal"));
  $("#homeBtn").addEventListener("click", () => { closeCheat(); renderHome(); });
  $("#cheatBtn").addEventListener("click", () => drawer.classList.contains("open") ? closeCheat() : openCheat());
  document.addEventListener("keydown", e => {
    if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === "Escape") {
      if (overlayOpen) closeOverlay();
      else if (drawer.classList.contains("open")) closeCheat();
      else if (view === "mission" || view === "review") renderHome();
      return;
    }
    if (!overlayOpen && view === "review" && (e.key === "Enter" || e.key === "ArrowRight") && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); $("#nextBtn") && $("#nextBtn").click(); return; }
    if (overlayOpen || view !== "mission") return;
    if (e.key === "ArrowRight" || (e.key === "Enter" && document.activeElement.tagName !== "BUTTON")) { e.preventDefault(); go(true); }
    if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
  });
  window.addEventListener("beforeunload", e => {
    if (view === "mission" && !overlayOpen) { e.preventDefault(); e.returnValue = ""; }
  });

  renderBar();
  renderHome();
})();
</script>
</body>
</html>
